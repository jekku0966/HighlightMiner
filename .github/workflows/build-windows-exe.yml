name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, v0.2-dev]
    paths:
      - "highlightminer/**"
      - "tests/**"
      - "tools/**"
      - "HighlightMiner.spec"
      - "build_windows.ps1"
      - "BUILD_WINDOWS.md"
      - "README.md"
      - "V0.2_DEV.md"
      - "RERUNS_AND_LEARNING.md"
      - "SETTINGS.md"
      - "CUDA_SETUP.md"
      - "ATTRIBUTIONS.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "pyproject.toml"
      - "settings.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Read project version
        id: project
        shell: powershell
        run: |
          $version = python .\tools\project_version.py
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Could not read project version from pyproject.toml." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaging HighlightMiner v$version for windows-x64"

      - name: Build portable application
        shell: powershell
        run: .\build_windows.ps1

      - name: Verify bundled Streamlit app and user docs
        shell: powershell
        run: |
          $required = @(
            ".\dist\HighlightMiner\_internal\highlightminer\app.py",
            ".\dist\HighlightMiner\README.md",
            ".\dist\HighlightMiner\V0.2_DEV.md",
            ".\dist\HighlightMiner\RERUNS_AND_LEARNING.md",
            ".\dist\HighlightMiner\SETTINGS.md",
            ".\dist\HighlightMiner\SECURITY.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required packaged file is missing: $path"
            }
          }
          Write-Host "Bundled Streamlit app and v0.2 user documentation are present."

      - name: Smoke-test frozen dependency imports
        shell: powershell
        run: |
          $output = & .\dist\HighlightMiner\HighlightMiner.exe doctor 2>&1
          $doctorExit = $LASTEXITCODE
          $text = $output -join "`n"
          $output | Out-Host

          if ($text -notmatch "CTranslate2:") {
            throw "Frozen doctor could not import CTranslate2."
          }
          if ($text -notmatch "faster-whisper:") {
            throw "Frozen doctor could not import faster-whisper."
          }

          $desktop = & .\dist\HighlightMiner\HighlightMiner.exe __desktop_probe__ 2>&1
          $desktopExit = $LASTEXITCODE
          $desktopText = $desktop -join "`n"
          $desktop | Out-Host
          if ($desktopExit -ne 0 -or $desktopText -notmatch "pywebview desktop shell: importable") {
            throw "Frozen executable could not import the pywebview/WebView2 desktop backend."
          }

          Write-Host "doctor exit code: $doctorExit (missing external FFmpeg/CUDA files are expected on CI)"
          exit 0

      - name: Smoke-test frozen Streamlit server
        shell: powershell
        run: |
          $env:HIGHLIGHTMINER_UI_MODE = "server"
          $env:STREAMLIT_SERVER_HEADLESS = "true"
          $exe = Resolve-Path ".\dist\HighlightMiner\HighlightMiner.exe"
          $stdoutLog = Join-Path $env:RUNNER_TEMP "highlightminer-ui.stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "highlightminer-ui.stderr.log"
          Remove-Item $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue

          $process = $null
          $ready = $false
          try {
            $process = Start-Process `
              -FilePath $exe `
              -WorkingDirectory ".\dist\HighlightMiner" `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog `
              -PassThru

            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
              catch {
                # Server may still be starting.
              }

              if ($process.HasExited) {
                throw "HighlightMiner.exe exited before the Streamlit server became ready. Exit code: $($process.ExitCode)"
              }
            }

            if (-not $ready) {
              throw "Frozen Streamlit server did not become ready on port 8501 within 60 seconds."
            }

            Write-Host "Frozen headless Streamlit backend responded successfully."
          }
          finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }

            Write-Host "--- frozen UI stdout ---"
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog | Out-Host }
            Write-Host "--- frozen UI stderr ---"
            if (Test-Path $stderrLog) { Get-Content $stderrLog | Out-Host }
          }

      - name: Upload Windows portable ZIP and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HighlightMiner-v${{ steps.project.outputs.version }}-windows-x64
          path: |
            dist/HighlightMiner-v${{ steps.project.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
